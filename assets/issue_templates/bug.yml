name: Something is broken
description: Explain what happened in everyday language.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
      description: Include steps to repeat it. Leave out passwords and private customer data.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Who is affected?
      description: Say whether the problem is in the testing version or the public version.
