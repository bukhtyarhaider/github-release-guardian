name: Guardian candidate
on:
  push:
    branches: [staging, 'release/**', 'hotfix/**']
  workflow_dispatch:
permissions: {}
concurrency:
  # Serializes continuous staging and frozen candidate verification on one environment.
  group: guardian-staging
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: bundle
        run: python3 .github/guardian/guardian.py pipeline build
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guardian-${{ github.sha }}
          path: ${{ steps.bundle.outputs.bundle }}
          if-no-files-found: error
          retention-days: 30
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.GUARDIAN_SITE_URL }}
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - run: python3 .github/guardian/guardian.py pipeline deploy-staging --bundle "$BUNDLE"
        env:
          BUNDLE: ${{ runner.temp }}/candidate
