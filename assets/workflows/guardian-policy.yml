name: Guardian policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [Guardian candidate]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to recheck after synchronization or setup
        required: true
        type: string
permissions: {}
jobs:
  evaluate:
    name: guardian-policy-evaluator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      deployments: read
      statuses: write
    steps:
      # NEVER check out a PR head in this privileged workflow.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 .github/guardian/guardian.py pipeline refresh-policy
        env:
          GH_TOKEN: ${{ github.token }}
