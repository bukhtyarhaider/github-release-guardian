name: Report a problem
description: Something failed while installing or using Guardian.
labels: [bug, 'status:needs-triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
      description: Explain in everyday language. Do not include passwords, tokens, or customer data.
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent were you using?
      options: [Codex, Claude Code, Google Antigravity, Another agent, Command line only]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Guardian version
      description: Give the release number or commit, if known.
  - type: textarea
    id: repeat
    attributes:
      label: How can we repeat the problem?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant error or workflow link
      description: Remove private information before posting. Report security issues privately instead.
