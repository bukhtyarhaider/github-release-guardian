name: Package tests
on:
  push:
    branches: [main, staging, 'feat/**', 'bugfix/**', 'docs/**', 'chore/**', 'release/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m pip install --requirement requirements-dev.txt
      - run: python3 scripts/validate_package.py
      - run: python3 -m compileall -q scripts tests .github
  required:
    name: package-tests
    if: always()
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every supported Python check to succeed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
