name: Package tests
on:
  push:
    branches: [main, staging, 'feat/**', 'bugfix/**', 'docs/**', 'chore/**', 'release/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m pip install --requirement requirements-dev.txt
      - run: python3 scripts/validate_package.py
      - run: python3 -m compileall -q scripts tests .github
  required:
    name: package-tests
    if: always()
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every supported Python check to succeed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
