name: Package candidate
on:
  push:
    branches: [staging, 'release/**', 'hotfix/**']
  workflow_dispatch:
permissions: {}
concurrency:
  group: guardian-package-staging
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_package.py
      - id: build
        run: python3 .github/repository_release.py build
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.sha }}
          path: ${{ steps.build.outputs.bundle }}
          if-no-files-found: error
          retention-days: 90
  stage:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - run: python3 .github/repository_release.py verify --bundle "$BUNDLE"
        env:
          BUNDLE: ${{ runner.temp }}/candidate
