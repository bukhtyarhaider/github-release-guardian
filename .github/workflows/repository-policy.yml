name: Repository policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [Package candidate]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to recheck
        required: true
        type: string
permissions: {}
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
      statuses: write
    steps:
      # Trusted base/default code only. Never execute the PR's scripts here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 .github/repository_release.py policy
        env:
          GH_TOKEN: ${{ github.token }}
